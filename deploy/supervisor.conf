[program:kos-queue]
command=php /var/www/kos-kosan/artisan queue:work --sleep=3 --tries=3
user=www-data
numprocs=2
autostart=true
autorestart=true

; Jangan jalankan schedule:work di supervisor BERSAMAAN dengan cron schedule:run
; (double scheduler = job ganda). Pilih SALAH SATU:
; Opsi A (disarankan, single-server): gunakan cron `* * * * * ... artisan schedule:run`
; Opsi B (tanpa cron): aktifkan blok di bawah ini.
; [program:kos-scheduler]
; command=php /var/www/kos-kosan/artisan schedule:work
; user=www-data
; autostart=true
; autorestart=true
